version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: fraud_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_use_strong_password}
      POSTGRES_DB: fraud_detection
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud_user -d fraud_detection"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "${APP_PORT:-8000}:${APP_PORT:-8000}"
    environment:
      DATABASE_URL: postgresql+asyncpg://fraud_user:${POSTGRES_PASSWORD:-changeme_use_strong_password}@postgres:5432/fraud_detection
      DATABASE_URL_SYNC: postgresql://fraud_user:${POSTGRES_PASSWORD:-changeme_use_strong_password}@postgres:5432/fraud_detection
      CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173"]'
      DEBUG: "false"
      LOG_LEVEL: INFO
      MODELS_DIR: ./models_artifacts
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
